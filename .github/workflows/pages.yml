name: Validate, build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate workbook and build website
        run: python scripts/build_site.py
      - name: Verify source fidelity and output
        run: |
          node --version
          python -m unittest discover -s tests -v
      - name: Publish validation and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-and-build
          path: |
            dist/data/quality.json
            dist/validation.json
            dist/validation.md
          if-no-files-found: ignore
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
